# Continuous integration — runs the unit-test suites for the Python
# CLI and the web IDE inside the same Docker images you can pull
# locally with `scripts/ci.sh`.
#
# How CI and local stay in sync:
#   - The job's `container:` directive picks the same `python:X-slim`
#     and `node:20-bullseye-slim` images Docker pulls in scripts/ci.sh.
#   - The actual install + test commands live in scripts/ci-python.sh
#     and scripts/ci-node.sh; both this workflow and the local script
#     exec them. So a green `scripts/ci.sh` locally near-guarantees a
#     green workflow run.
#
# Why `container:` instead of `docker run` inside a step:
#   - The runner-managed container approach is the idiomatic Actions
#     pattern, gets us network/cache integration for free, and avoids
#     Docker-in-Docker's quirks. The price is one extra image pull at
#     job start (~3-8 s for these slim images, geo-CDN'd).

name: tests

on:
  # Tests run on every commit, on every branch — there's no
  # "validation only on PRs to main" gate. Cheap-to-run unit suite,
  # cheaper to catch regressions early than to merge a broken branch.
  push:
  pull_request:
  workflow_dispatch:

# A new commit on a branch cancels its older in-flight run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }} · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        # Floor (3.9) is what pyproject.toml advertises; 3.12 is the
        # most-deployed LTS-ish; 3.14 is the maintainer's machine.
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      # The slim base images don't ship `bash` reliably across all
      # tags, but they all have it under /usr/bin/bash from the
      # debian-slim base. We invoke the script explicitly via bash
      # to avoid hashbang surprises.
      - name: Run CI fixture (Python)
        run: bash scripts/ci-python.sh

  node:
    name: node 20 · node:test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: node:20-bullseye-slim
    steps:
      - uses: actions/checkout@v4
      - name: Run CI fixture (Node)
        run: bash scripts/ci-node.sh
