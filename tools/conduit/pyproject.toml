[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit"
version = "1.0.0"
description = "CLI tool for managing CONDUIT devices"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
# `pip install -e ".[test]"` for local runs and CI. Kept separate from
# the runtime deps so end users don't pull in pytest.
test = [
    "pytest>=8",
]
# `pip install -e ".[analysis]"` adds the HDF5 + numpy stack used by
# `conduit analyze-hdf5`. Kept optional so the core CLI (build / flash
# / OTA / ws-probe) stays a click+httpx-only install for users who
# don't need the analyzer.
analysis = [
    "h5py>=3.10",
    "numpy>=1.24",
]

[project.scripts]
conduit = "conduit_cli.cli:main"

[tool.setuptools.packages.find]
include = ["conduit_cli*"]
